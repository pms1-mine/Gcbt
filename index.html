<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전산</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1c2333;--sub:#6b7488;--bd:#dde2ec;--pri:#3b6cf6;--ok:#16a34a;--no:#dc2626;--okb:#dcfce7;--nob:#fee2e2;--star:#f59e0b}
[data-theme=dark]{--bg:#12151c;--card:#1b202b;--tx:#e6e9f0;--sub:#8b93a7;--bd:#2c3342;--pri:#6c93ff;--ok:#4ade80;--no:#f87171;--okb:#12301f;--nob:#3a1818}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6}
#app{max-width:760px;margin:0 auto;padding:12px 14px 60px}
button{font:inherit;color:inherit;cursor:pointer}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar h1{font-size:20px;margin:0;flex:1}
.bar .mid{flex:1;text-align:center;font-weight:700}
.ib{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:var(--bg);border-radius:20px;padding:6px 14px;font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=number],select,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
input[type=number]{width:90px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--pri);color:#fff;width:100%;margin-top:8px}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.w{background:var(--no)}
.prog{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--pri)}
.tag{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.tag b{color:var(--pri)}
.qn{font-size:22px;font-weight:800;margin:6px 0 4px}
.qt{font-size:17px;white-space:pre-wrap;margin-bottom:10px}
.qimg{display:block;max-width:100%;height:auto;margin:6px auto 12px;background:#fff;border-radius:8px;padding:6px}
.star{background:none;border:0;font-size:26px;color:var(--sub);padding:0 4px}
.star.on{color:var(--star)}
.ch{display:flex;gap:10px;width:100%;text-align:left;padding:13px;border:1px solid var(--bd);background:var(--card);border-radius:12px;margin:8px 0;font-size:16px}
.ch:hover{border-color:var(--pri)}
.ch.ok{border-color:var(--ok);background:var(--okb)}
.ch.no{border-color:var(--no);background:var(--nob)}
.ex{border-left:4px solid var(--pri);background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:12px;white-space:pre-wrap}
.ex textarea{width:100%;min-height:120px}
.res{font-weight:800;margin-top:10px}
.res.ok{color:var(--ok)}.res.no{color:var(--no)}
.nav{display:flex;gap:10px}.nav .btn{margin-top:0}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:75vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:12px 0}
.cell{position:relative;border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:9px 0}
.cell.ok{background:var(--okb);border-color:var(--ok)}
.cell.no{background:var(--nob);border-color:var(--no)}
.cell.cur{outline:2px solid var(--pri)}
.cell.bm::after{content:"★";position:absolute;top:-2px;right:3px;font-size:11px;color:var(--star)}
.big{font-size:40px;font-weight:800;text-align:center;margin:10px 0}
.sm{font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ========= 기본 문제 (예시) =========
   형식: {id, subject(과목), unit(단원), round, img(선택: 그림 URL 또는 data URI), q, choices:[...], answer:정답번호(1부터), exp:풀이}
   문제를 추가하려면 아래 배열에 같은 형식으로 넣거나, 홈 화면의 '문제 불러오기(JSON)'를 사용하세요. */
const BASE=[
{id:"lg26-01",subject:"컴퓨터일반",unit:"컴퓨터구조",round:"2026 지방직 9급",q:"다음 설명에 해당하는 문자 데이터 표현은?\n\n전 세계 언어를 하나의 코드 체계 안으로 통합하기 위해 만들어진 코드로서 2바이트를 사용해서 각 국가의 언어를 표현할 수 있다.",choices:["Unicode","ASCII 코드","BCD 코드","EBCDIC 코드"],answer:1,exp:"Unicode: 전 세계 문자를 통합한 2바이트 코드 체계.\nASCII는 7비트(영문), BCD는 4비트(숫자), EBCDIC은 8비트(IBM)."},
{id:"lg26-02",subject:"컴퓨터일반",unit:"네트워크",round:"2026 지방직 9급",q:"TELNET보다 안전한 원격 접속 기능을 제공하는 서비스는?",choices:["SSH(Secure SHell)","VoIP(Voice over IP)","SMTP(Simple Mail Transfer Protocol)","DHCP(Dynamic Host Configuration Protocol)"],answer:1,exp:"SSH는 암호화된 원격 접속(22번 포트). TELNET은 평문 전송이라 보안에 취약."},
{id:"lg26-03",subject:"컴퓨터일반",unit:"네트워크",round:"2026 지방직 9급",q:"MAC(Media Access Control) 주소를 표현하는 데 필요한 16진수 개수는?",choices:["4","8","12","16"],answer:3,exp:"MAC 주소는 48비트. 16진수 1자리=4비트이므로 48÷4=12개. (예: AA-BB-CC-DD-EE-FF)"},
{id:"lg26-04",subject:"컴퓨터일반",unit:"컴퓨터구조",round:"2026 지방직 9급",q:"다음 설명에 해당하는 캐시(cache) 기억장치의 교체 알고리즘은?\n\n캐시 안에 가장 오래된 블록을 교체하는 방식으로 쉽게 구현할 수 있으나 적중률 면에서는 높은 효율을 보이지 않는다.",choices:["FIFO(First-In First-Out)","LFU(Least Frequently Used)","LRU(Least Recently Used)","Random"],answer:1,exp:"가장 오래된(먼저 들어온) 블록 교체 = FIFO.\nLRU=가장 오래 사용 안 한 것, LFU=사용 빈도 가장 낮은 것."},
{id:"lg26-05",subject:"컴퓨터일반",unit:"컴퓨터구조",round:"2026 지방직 9급",q:"10진수 +5를 1의 보수(1’s complement)로 변환하면? (단, 저장 공간은 8비트로 한다)",choices:["11111110","11111101","11111010","11111011"],answer:3,exp:"+5 = 00000101 → 모든 비트 반전 → 11111010.\n1의 보수 = 비트 반전, 2의 보수 = 반전 + 1."},
{id:"lg26-06",subject:"컴퓨터일반",unit:"자료구조",round:"2026 지방직 9급",q:"순차 탐색(sequential search)과 이진 탐색(binary search)에 대한 설명으로 옳은 것은?",choices:["순차 탐색의 시간 복잡도는 ‘평균의 경우’ ____ 이다. (원문 수식 누락)","이진 탐색은 재귀(recursive) 호출 방식으로 구현 가능하다.","순차 탐색은 입력 데이터가 정렬되어 있을 때 원하는 값을 효율적으로 탐색하는 알고리즘이다.","이진 탐색은 입력 데이터의 처음부터 끝까지 차례대로 비교하며 원하는 값을 탐색하는 알고리즘이다."],answer:2,exp:"이진 탐색: 정렬된 데이터에서 중간값과 비교하며 절반씩 줄임 → 반복문/재귀 모두 구현 가능, O(log n).\n순차 탐색: 처음부터 차례로 비교, 정렬 필요 없음."},
{id:"lg26-07",subject:"컴퓨터일반",unit:"네트워크",round:"2026 지방직 9급",q:"TCP/IP 프로토콜 계층 구조에서 응용 계층 프로토콜이 아닌 것은?",choices:["FTP","RIP","HTTP","SMTP"],answer:2,exp:"RIP는 라우팅 프로토콜(거리 벡터 방식)로 네트워크(인터넷) 계층 쪽으로 분류.\nFTP·HTTP·SMTP는 응용 계층."},
{id:"lg26-08",subject:"컴퓨터일반",unit:"데이터베이스",round:"2026 지방직 9급",q:"관계형 데이터 모델에서 릴레이션(relation)에 대한 설명으로 옳은 것은?",choices:["한 릴레이션에서 튜플(tuple)의 중복을 허용한다.","속성(attribute)은 원자 값(atomic value)을 가진다.","한 릴레이션에 포함된 튜플 간의 순서는 의미가 있다.","한 릴레이션을 구성하는 속성 간의 순서는 의미가 있다."],answer:2,exp:"릴레이션 특징: 튜플 중복 불가, 튜플 순서 무의미, 속성 순서 무의미, 속성값은 원자값."},
{id:"lg26-09",subject:"컴퓨터일반",unit:"컴퓨터구조",round:"2026 지방직 9급",q:"중앙처리장치의 레지스터(register)가 아닌 것은?",choices:["MBR(Memory Buffer Register)","PC(Program Counter)","IR(Instruction Register)","ALU(Arithmetic and Logical Unit)"],answer:4,exp:"ALU는 연산 장치이지 레지스터가 아님. (MBR, PC, IR, MAR, AC 등이 레지스터)"},
{id:"lg26-10",subject:"컴퓨터일반",unit:"네트워크",round:"2026 지방직 9급",q:"OSI 7 계층과 계층별로 사용하는 네트워크 장비를 옳게 짝지은 것은?",choices:["전송 계층 － 허브(hub)","데이터 링크 계층 － 라우터(router)","데이터 링크 계층 － 브릿지(bridge)","데이터 링크 계층 － 리피터(repeater)"],answer:3,exp:"물리: 허브·리피터 / 데이터링크: 브리지·스위치 / 네트워크: 라우터 / 전송 이상: 게이트웨이."},
{id:"lg26-11",subject:"컴퓨터일반",unit:"인공지능",round:"2026 지방직 9급",q:"기계 학습의 학습 유형인 비지도 학습(unsupervised learning)에 대한 설명으로 옳은 것은?",choices:["핵심 개념은 에이전트, 환경, 상태, 액션, 보상 등이다.","군집화(clustering)를 사용할 수 없다.","학습 알고리즘이 누적 보상을 최대화하는 방향으로 진행된다.","레이블이 없는 학습용 데이터만을 대상으로 학습 알고리즘이 스스로 패턴을 발견한다."],answer:4,exp:"비지도 학습: 정답(레이블) 없이 패턴 발견 (군집화, 차원 축소).\n①③은 강화학습 설명."},
{id:"lg26-12",subject:"컴퓨터일반",unit:"프로그래밍",round:"2026 지방직 9급",q:"다음 C 프로그램의 출력 결과는?\n\n#include <stdio.h>\n#include <string.h>\nint main(void) {\n  char s[] = \"COMPUTER\";\n  char* p = s + 2;\n  *(p + 3) = 'X';\n  printf(\"%s\\n\", s);\n  printf(\"%zu\\n\", strlen(p));\n  return 0;\n}",choices:["COMXUTER 5","COMPUXER 5","COMXUTER 6","COMPUXER 6"],answer:4,exp:"p = s+2 → \"MPUTER\"를 가리킴. *(p+3) = s[5] = 'T' → 'X' 로 변경 → \"COMPUXER\".\nstrlen(p) = \"MPUXER\" = 6."},
{id:"lg26-13",subject:"컴퓨터일반",unit:"운영체제",round:"2026 지방직 9급",q:"(가), (나)에 들어갈 용어를 바르게 연결한 것은?\n\n(가) 시스템 호출은 실행 중인 프로세스로부터 새로운 프로세스를 복사하는 함수로 기존 프로세스는 부모 프로세스, 새로 생성된 프로세스는 자식 프로세스가 된다. (가) 를 이용해 생성된 자식 프로세스에게는 (나) 을 반환한다.",choices:["(가) exec()  (나) 0","(가) exec()  (나) 1","(가) fork()  (나) 0","(가) fork()  (나) 1"],answer:3,exp:"fork(): 프로세스 복사. 자식에게는 0, 부모에게는 자식의 PID를 반환.\nexec(): 현재 프로세스를 새 프로그램으로 교체."},
{id:"lg26-14",subject:"컴퓨터일반",unit:"자료구조",round:"2026 지방직 9급",q:"스택(stack)과 큐(queue)에 대한 설명으로 옳은 것은?",choices:["스택은 먼저 삽입된 데이터가 먼저 삭제되는 FIFO(First-In First-Out) 구조이다.","큐는 나중에 삽입된 데이터가 먼저 삭제되는 LIFO(Last-In First-Out) 구조이다.","시스템 스택은 프로그램 실행 시 함수의 호출과 복귀에 따른 실행 순서를 관리할 수 있다.","큐는 배열(array)을 사용하여 구현할 수 없다."],answer:3,exp:"스택=LIFO, 큐=FIFO. 함수 호출/복귀는 시스템(호출) 스택으로 관리. 큐도 배열(원형 큐)로 구현 가능."},
{id:"lg26-15",subject:"컴퓨터일반",unit:"컴퓨터구조",round:"2026 지방직 9급",q:"다음에서 설명하는 시스템 버스(bus) 중재 방식은?\n\n○ 버스 중재기가 각 버스 마스터들이 버스 사용을 요구하는지 주기적으로 검사하여 버스 사용 여부를 결정한다.\n○ 하드웨어 방식과 소프트웨어 방식으로 구분된다.",choices:["병렬","직렬","분산","폴링"],answer:4,exp:"주기적으로 검사(poll)하여 결정 = 폴링 방식."},
{id:"lg26-16",subject:"컴퓨터일반",unit:"운영체제",round:"2026 지방직 9급",q:"프로세스 도착 시간과 실행 시간은 다음과 같다. FCFS(First-Come First-Served) 스케줄링 알고리즘을 사용하였을 경우, P1, P2, P3, P4의 반환 시간에 대한 평균은?\n\n프로세스 / 도착 시간 / 실행 시간\nP1 / 0 / 3\nP2 / 2 / 8\nP3 / 5 / 4\nP4 / 8 / 3",choices:["6","8","10","12"],answer:2,exp:"실행 순서: P1(0~3), P2(3~11), P3(11~15), P4(15~18).\n반환시간 = 종료 − 도착 → 3, 9, 10, 10 → 합 32 ÷ 4 = 8."},
{id:"lg26-17",subject:"컴퓨터일반",unit:"인공지능",round:"2026 지방직 9급",q:"딥러닝에 대한 설명으로 옳지 않은 것은?",choices:["딥러닝 모델은 2개 이상의 은닉층을 가질 수 있으며 음성 인식, 자연어 처리 등에 활용된다.","합성곱 계층(convolutional layer)은 이미지에 대한 특징 정보를 추출한다.","LSTM(Long Short-Term Memory)은 장기 및 단기 메모리 기능을 포함하는 합성곱 신경망(convolutional neural network)이다.","순환 신경망(recurrent neural network)은 시간적으로 연속성이 있는 데이터를 처리하기 위한 인공 신경망이다."],answer:3,exp:"LSTM은 합성곱 신경망(CNN)이 아니라 순환 신경망(RNN)의 개선 모델 (장기 의존성 문제 해결)."},
{id:"lg26-18",subject:"컴퓨터일반",unit:"프로그래밍",round:"2026 지방직 9급",q:"다음 Java 프로그램의 실행 결과는?\n\nclass Main {\n  public static void div(double a, double b){\n    try{\n      System.out.println(a / b);\n    }catch(ArithmeticException e){\n      System.out.println(\"divide by zero\");\n    }\n  }\n  public static void main(String args[]) {\n    div(3, 2);\n    div(2, 0);\n  }\n}",choices:["1  Infinity","1.5  Infinity","1  divide by zero","1.5  divide by zero"],answer:2,exp:"매개변수가 double이라 3/2 = 1.5. 실수 나눗셈은 0으로 나눠도 ArithmeticException이 아니라 Infinity가 출력됨.\n(정수 나눗셈일 때만 예외 발생)"},
{id:"lg26-19",subject:"컴퓨터일반",unit:"운영체제",round:"2026 지방직 9급",q:"다중 스레드(multithreading) 모델에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 스레드는 사용자 스레드와 커널 스레드가 있다.\nㄴ. 일대일 모델은 다중 처리기에서 다중 스레드가 병렬로 수행되는 것을 허용하지 않는다.\nㄷ. 다대일 모델에서는 프로세스에 속한 하나의 스레드가 입출력 작업을 위해 대기 상태에 들어가도 나머지 스레드는 계속 실행된다.",choices:["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ"],answer:1,exp:"ㄴ 일대일 모델은 병렬 수행 허용. ㄷ 다대일 모델은 한 스레드가 블록되면 프로세스 전체가 블록됨."},
{id:"lg26-20",subject:"컴퓨터일반",unit:"소프트웨어공학",round:"2026 지방직 9급",q:"다음 설명에 해당하는 디자인 패턴은?\n\n○ 객체를 오직 하나만 생성한다.\n○ 외부에서 접근하는 것을 통제하기 위해 생성자를 private으로 선언한다.",choices:["Adapter 패턴","Composite 패턴","Singleton 패턴","Factory method 패턴"],answer:3,exp:"Singleton: 인스턴스를 하나만 생성, 생성자를 private으로 선언하고 getInstance()로 접근."},
{id:"lg26-s01",subject:"정보보호론",unit:"악성코드·공격기법",round:"2026 지방직 9급",q:"악성 코드(malware)에 대한 설명으로 옳지 않은 것은?",choices:["바이러스는 다른 프로그램에 자신을 복제하여 악의적 목적을 수행한다.","랜섬웨어는 사용자의 파일을 암호화하여 자료를 인질로 잡고 금전을 요구한다.","웜은 네트워크를 통해 자신을 복제하고 전파할 수 있는 악성 프로그램이다.","트로이목마는 정상적인 프로그램으로 위장하여 자기 복제를 통해 다른 시스템으로 확산한다."],answer:4,exp:"트로이목마는 정상 프로그램으로 위장하지만 자기 복제를 하지 않음.\n바이러스=숙주 프로그램에 복제, 웜=독립적으로 네트워크 전파·자기 복제."},
{id:"lg26-s02",subject:"정보보호론",unit:"암호학",round:"2026 지방직 9급",q:"대칭키 암호 알고리즘에 대한 설명으로 옳지 않은 것은?",choices:["암호화/복호화 속도는 공개키 암호보다 빠르다.","키의 길이가 공개키 암호보다 상대적으로 짧다.","공개키는 암호화에 사용하고 개인키는 복호화에 사용한다.","사용자의 증가에 따라 관리해야 할 키의 수가 비례적으로 늘어난다."],answer:3,exp:"공개키/개인키는 비대칭키(공개키) 암호의 개념. 대칭키는 암·복호화에 같은 키(비밀키) 사용.\n대칭키 키 개수: n(n−1)/2."},
{id:"lg26-s03",subject:"정보보호론",unit:"암호학",round:"2026 지방직 9급",q:"(가) ～ (라)에 들어갈 용어를 바르게 연결한 것은?\n\n구분 / 메시지 인증 코드 / 전자서명\n송신자 / (가)로 MAC값을 계산 / (나)로 서명을 작성\n수신자 / (다)로 MAC값을 계산 / (라)로 서명을 검증",choices:["(가) 공유키  (나) 공개키  (다) 공유키  (라) 개인키","(가) 개인키  (나) 공유키  (다) 공개키  (라) 공유키","(가) 공유키  (나) 개인키  (다) 공유키  (라) 공개키","(가) 개인키  (나) 공유키  (다) 공유키  (라) 공개키"],answer:3,exp:"MAC: 송·수신자가 같은 공유키(비밀키) 사용.\n전자서명: 송신자 개인키로 서명 → 수신자가 송신자 공개키로 검증."},
{id:"lg26-s04",subject:"정보보호론",unit:"디지털 포렌식",round:"2026 지방직 9급",q:"디지털 포렌식에 대한 설명으로 옳지 않은 것은?",choices:["디지털 포렌식 과정에서 획득한 모든 증거는 법적 효력을 가진다.","수집된 증거가 결함이 없이 위ㆍ변조되지 않았음을 증명할 수 있어야 한다.","동일한 조건과 동일한 상황이라면 디지털 포렌식의 분석 결과는 항상 같은 결과가 나와야 한다.","증거를 획득한 뒤에는 이송, 분석, 보관, 법정 제출이라는 일련의 과정 및 각 과정의 담당자가 명확해야 하며 이에 대한 추적이 가능해야 한다."],answer:1,exp:"적법 절차로 수집된 증거만 법적 효력 인정 (모든 증거 ✕).\n포렌식 원칙: 정당성, 무결성, 재현성, 연계 보관성(Chain of Custody), 신속성."},
{id:"lg26-s05",subject:"정보보호론",unit:"암호학",round:"2026 지방직 9급",q:"암호화 알고리즘에 대한 설명으로 옳은 것은?",choices:["DES는 56비트 키를 사용하는 대칭키 암호 알고리즘이다.","AES는 국내에서 개발된 블록 암호 알고리즘으로 국제 표준이 되었다.","SEED는 3개의 키값을 사용하고 DES의 3배인 168비트의 보안 강도를 제공한다.","RSA는 큰 소수의 곱을 인수분해하기 어렵다는 수학적 원리에 기반한 대칭키 암호 알고리즘이다."],answer:1,exp:"DES: 64비트 블록, 56비트 키(+패리티 8비트).\nAES=벨기에 Rijndael, SEED=한국(128비트 블록), 3DES=168비트, RSA=비대칭키(소인수분해)."},
{id:"lg26-s06",subject:"정보보호론",unit:"암호학",round:"2026 지방직 9급",q:"국내 국가보안기술연구소 주도로 개발된 암호화 알고리즘은?",choices:["DES","ARIA","RC5","IDEA"],answer:2,exp:"ARIA: 국가보안기술연구소 주도 + 학계 개발 (Academy·Research Institute·Agency). 128비트 블록 암호.\nSEED는 KISA 개발."},
{id:"lg26-s07",subject:"정보보호론",unit:"악성코드·공격기법",round:"2026 지방직 9급",q:"사용자가 입력한 키보드 정보를 가로채는 방법은?",choices:["피싱(phishing)","파밍(pharming)","스미싱(smishing)","키로깅(keylogging)"],answer:4,exp:"키로깅: 키 입력 가로채기.\n피싱=가짜 사이트/메일, 파밍=DNS·hosts 조작으로 가짜 사이트 유도, 스미싱=문자(SMS) 피싱."},
{id:"lg26-s08",subject:"정보보호론",unit:"접근통제·인증",round:"2026 지방직 9급",q:"인증에 대한 설명으로 옳지 않은 것은?",choices:["패스워드는 길이가 길고 대소문자, 숫자, 특수문자를 조합할수록 무차별 대입 공격에 대한 안전성이 높아진다.","생체 인증은 신체적 특성을 이용하므로 원천적으로 복제가 불가능하여 별도의 보안 대책이 필요하지 않다.","SSO(Single Sign On)는 한 번의 인증으로 다수의 시스템에 접근할 수 있게 하는 인증 시스템이다.","OTP(One Time Password)는 한 번 생성되면 그 인증값이 임시적으로 한 번에 한해서만 유효하며, 시간 동기화, 이벤트 동기화, 챌린지ㆍ응답 등의 방식으로 생성된다."],answer:2,exp:"생체 정보도 위·변조(복제) 가능, 오인식(FAR/FRR)·유출 시 변경 불가 등 별도 보안 대책 필요."},
{id:"lg26-s09",subject:"정보보호론",unit:"네트워크 보안",round:"2026 지방직 9급",q:"공격자가 공격대상의 IP주소로 위장하여 브로드캐스팅 방식을 통해 ICMP echo request를 다수의 호스트에 전송하는 공격은?",choices:["Smurf","SYN Flooding","ARP Spoofing","ICMP Redirect"],answer:1,exp:"Smurf: 출발지 IP를 피해자로 위조 + 브로드캐스트 ICMP Echo → 다수 호스트의 응답이 피해자에게 집중 (증폭 DoS)."},
{id:"lg26-s10",subject:"정보보호론",unit:"네트워크 보안",round:"2026 지방직 9급",q:"허니팟(honeypot)에 대한 설명으로 옳지 않은 것은?",choices:["허니팟은 공격자에게 쉽게 노출되어야 한다.","허니팟은 쉽게 해킹이 가능한 것처럼 취약해 보이게 한다.","허니넷(honeynet)은 여러 허니팟을 포함한 네트워크를 의미한다.","허니팟은 시스템을 통과하는 패킷에 대해 일부분만을 샘플링하여 감시한다."],answer:4,exp:"허니팟은 공격자를 유인하여 침입 행위 전체를 기록·분석하는 미끼 시스템. 패킷 일부 샘플링 감시는 허니팟의 특징이 아님."},
{id:"lg26-s11",subject:"정보보호론",unit:"접근통제·인증",round:"2026 지방직 9급",q:"정보시스템의 접근 제어(access control) 또는 로그 관리에 대한 설명으로 옳지 않은 것은?",choices:["인증(authentication)은 자신의 신원(identity)을 증명하기 위하여 행하는 과정이다.","감사 추적(audit trail)은 시스템의 위험을 평가하고 비용 대비 효과적인 대응책을 수립하는 과정이다.","인가(authorization)는 인증된 주체에게 자원에 대한 접근 권한을 부여하거나 제한하는 과정이다.","책임 추적성(accountability)은 시스템에 접근한 주체가 어떤 행동을 하였는지 기록하여 필요 시 그 행위자를 추적할 수 있게 한다."],answer:2,exp:"②는 위험 분석·평가 설명. 감사 추적은 시스템 사용 기록(로그)을 남겨 사후 추적·검토하는 것."},
{id:"lg26-s12",subject:"정보보호론",unit:"보안관리",round:"2026 지방직 9급",q:"영국이 제정한 정보보호 관리체계 표준은?",choices:["BS7799","FISMA","PIMS","NIST 800-53"],answer:1,exp:"BS7799: 영국 표준 → ISO/IEC 27001·27002로 발전.\nFISMA·NIST 800-53=미국, PIMS=개인정보 관리체계."},
{id:"lg26-s13",subject:"정보보호론",unit:"시스템·SW 보안",round:"2026 지방직 9급",q:"버퍼 오버플로 공격에 대한 설명으로 옳지 않은 것은?",choices:["버퍼에 정해진 크기 이상의 데이터를 입력하여 프로그램을 공격하는 행위이다.","버퍼 오버플로에 취약한 함수(strcpy(), strcat() 등)는 사용하지 않는 것이 좋다.","메모리 공격을 방어하려고 주소 공간 배치를 난수화하는 기법을 스택 가드(stack guard)라 한다.","세그멘테이션 폴트(segmentation fault)가 발생했을 때 버퍼 오버플로 공격을 의심할 수 있다."],answer:3,exp:"주소 공간 배치 난수화 = ASLR. 스택 가드는 리턴 주소 앞에 카나리(canary) 값을 두어 변조를 탐지하는 기법."},
{id:"lg26-s14",subject:"정보보호론",unit:"보안 일반",round:"2026 지방직 9급",q:"보안 요소 중 인가된 사용자에게만 정보에 접근할 수 있도록 허용하는 것은?",choices:["가용성(availability)","무결성(integrity)","기밀성(confidentiality)","부인방지(non-repudiation)"],answer:3,exp:"기밀성=인가된 자만 접근, 무결성=허가 없는 변경 방지, 가용성=필요할 때 사용 가능, 부인방지=행위 사실 부인 못하게 함."},
{id:"lg26-s15",subject:"정보보호론",unit:"보안관리",round:"2026 지방직 9급",q:"정량적 위험 분석 방법에 해당하는 것은?",choices:["델파이법","시나리오법","순위결정법","과거자료 분석법"],answer:4,exp:"정량적: 과거자료 분석법, 수학공식법, 확률분포법, 점수법.\n정성적: 델파이법, 시나리오법, 순위결정법."},
{id:"lg26-s16",subject:"정보보호론",unit:"웹 보안",round:"2026 지방직 9급",q:"CSRF(Cross-Site Request Forgery) 공격에 대한 설명으로 옳은 것은?",choices:["쿠키를 변조한 후 불법적인 인증을 거쳐 권한을 획득하는 공격이다.","악성 URL을 보내서 클릭 시 피해자의 정보를 유출하는 공격이다.","입력 값에 대한 유효성을 검증하지 않고 그대로 사용할 때 발생할 수 있는 데이터베이스 공격이다.","로그인된 사용자가 자신의 의지와는 무관하게 공격자가 의도한 행위를 하는 공격이다."],answer:4,exp:"CSRF: 인증된 사용자의 권한을 악용해 의도치 않은 요청 전송. ③은 SQL 삽입 공격 설명."},
{id:"lg26-s17",subject:"정보보호론",unit:"개인정보 보호법",round:"2026 지방직 9급",q:"개인정보 보호법 상 개인정보처리자가 제3자에게 개인정보의 처리 업무를 위탁하는 문서에 포함되어야 하는 내용이 아닌 것은?",choices:["개인정보의 기술적ㆍ관리적 보호조치에 관한 사항","개인정보의 안전한 관리를 위하여 대통령령으로 정한 사항","위탁업무 수행 목적 외 개인정보의 처리 금지에 관한 사항","정보주체의 권리침해에 대한 조사 및 이에 따른 처분에 관한 사항"],answer:4,exp:"위탁 문서 포함 사항(법 제26조): ①위탁업무 수행 목적 외 처리 금지 ②기술적·관리적 보호조치 ③그 밖에 안전한 관리를 위해 대통령령으로 정한 사항."},
{id:"lg26-s18",subject:"정보보호론",unit:"개인정보 보호법",round:"2026 지방직 9급",q:"개인정보 보호법 상 가명정보의 처리에 대한 설명으로 옳지 않은 것은?",choices:["개인정보처리자는 통계작성, 과학적 연구, 공익적 기록보존 등을 위하여 정보주체의 동의 없이 가명정보를 처리할 수 없다.","통계작성, 과학적 연구, 공익적 기록보존 등을 위한 서로 다른 개인정보처리자 간의 가명정보의 결합은 개인정보 보호위원회 또는 관계 중앙행정기관의 장이 지정하는 전문기관이 수행한다.","개인정보처리자는 가명정보를 처리하는 과정에서 특정 개인을 알아볼 수 있는 정보가 생성된 경우에는 즉시 해당 정보의 처리를 중지하고, 지체 없이 회수ㆍ파기하여야 한다.","개인정보처리자는 가명정보를 처리하는 경우에는 원래의 상태로 복원하기 위한 추가 정보를 별도로 분리하여 보관ㆍ관리하는 등 해당 정보가 분실ㆍ도난ㆍ유출ㆍ위조ㆍ변조 또는 훼손되지 않도록 대통령령으로 정하는 바에 따라 안전성 확보에 필요한 기술적ㆍ관리적 및 물리적 조치를 하여야 한다."],answer:1,exp:"통계작성·과학적 연구·공익적 기록보존 목적이면 정보주체의 동의 없이 가명정보 처리 가능(법 제28조의2)."},
{id:"lg26-s19",subject:"정보보호론",unit:"개인정보 보호법",round:"2026 지방직 9급",q:"개인정보 보호법 상 영업양도 등에 따른 개인정보의 이전 시 해당 정보주체에게 미리 알려야 하는 사항에 해당하지 않는 것은?",choices:["개인정보의 수집 출처","개인정보를 이전하려는 사실","개인정보를 이전받는 자의 성명(법인의 경우에는 법인의 명칭을 말한다), 주소, 전화번호 및 그 밖의 연락처","정보주체가 개인정보의 이전을 원하지 아니하는 경우 조치할 수 있는 방법 및 절차"],answer:1,exp:"영업양도 시 사전 고지 3가지(법 제27조): 이전하려는 사실 / 이전받는 자의 성명·주소·연락처 / 이전을 원치 않을 때의 조치 방법·절차."},
{id:"lg26-s20",subject:"정보보호론",unit:"네트워크 보안",round:"2026 지방직 9급",q:"다음에서 설명하는 네트워크 공격 기술은?\n\n신뢰 관계에 있는 두 개의 호스트 사이에서 하나의 시스템을 마비시킨 후 마치 자신이 신뢰관계에 있는 호스트인 것처럼 속이는 것이다.",choices:["DNS Spoofing","IP Spoofing","Switch Jamming","Teardrop"],answer:2,exp:"IP Spoofing: 신뢰 호스트의 IP로 위장 (한쪽 호스트는 DoS로 무력화).\nTeardrop=IP 단편화 오프셋 조작 DoS, Switch Jamming=MAC 테이블 넘치게 해 허브처럼 동작시킴."},
{id:"lg26n-01",subject:"정보보호론",unit:"암호학",round:"2026 국가직 9급",q:"일방향 해시 함수의 응용으로 적합하지 않은 것은?",choices:["전자서명","의사난수 생성","데이터 암복호화","소프트웨어 변경 검출"],answer:3,exp:"해시는 되돌릴 수 없는(복호화 불가) 함수라 암복호화에는 부적합.\n응용: 무결성 검증(변경 검출), 전자서명, 메시지 인증, 의사난수 생성, 패스워드 저장."},
{id:"lg26n-02",subject:"정보보호론",unit:"암호학",round:"2026 국가직 9급",q:"RSA 암호 알고리즘에 대한 설명으로 옳지 않은 것은?",choices:["공개키 기반 암호 방식이다.","개인키는 공개하지 않고 비밀로 유지한다.","큰 수의 소인수분해가 어렵다는 특성을 이용한다.","공개키로 암호화한 메시지는 전자서명 기능을 제공한다."],answer:4,exp:"공개키로 암호화 → 기밀성(개인키 소유자만 복호화).\n전자서명(인증·부인방지)은 개인키로 서명하고 공개키로 검증."},
{id:"lg26n-03",subject:"정보보호론",unit:"접근통제·인증",round:"2026 국가직 9급",q:"DBMS에서 데이터베이스 객체에 대한 권한 부여를 위해 사용하는 SQL 명령어는?",choices:["ALTER","GRANT","INSERT","COMMIT"],answer:2,exp:"GRANT=권한 부여, REVOKE=권한 회수 (DCL).\nCOMMIT은 TCL, INSERT는 DML, ALTER는 DDL."},
{id:"lg26n-04",subject:"정보보호론",unit:"네트워크 보안",round:"2026 국가직 9급",q:"SSLv3(Secure Sockets Layer version 3)의 레코드 프로토콜에서 응용 프로그램으로부터 획득한 데이터를 송신하기 위해 수행하는 과정을 순서대로 바르게 나열한 것은?",choices:["압축(옵션) → MAC 추가 → 암호화 → 단편화 → 헤더 추가","압축(옵션) → 헤더 추가 → 암호화 → 단편화 → MAC 추가","단편화 → 압축(옵션) → MAC 추가 → 암호화 → 헤더 추가","단편화 → 암호화 → MAC 추가 → 압축(옵션) → 헤더 추가"],answer:3,exp:"SSL 레코드 프로토콜 송신 순서: 단편화 → 압축 → MAC 추가 → 암호화 → 헤더 추가.\n암기: 단-압-맥-암-헤"},
{id:"lg26n-05",subject:"정보보호론",unit:"보안관리",round:"2026 국가직 9급",q:"조직의 자산 및 정보를 보호하기 위한 정보보호 관리체계의 국제 인증 규격은?",choices:["CC","ITSEC","TCSEC","ISO/IEC 27001"],answer:4,exp:"ISO/IEC 27001 = 정보보호 관리체계(ISMS) 국제 표준.\nCC·ITSEC·TCSEC는 제품(시스템) 보안성 평가 기준."},
{id:"lg26n-06",subject:"정보보호론",unit:"시스템·SW 보안",round:"2026 국가직 9급",q:"시스템 보안에서 사용자와 시스템 사이 또는 두 시스템 사이의 활성화된 접속을 관리하는 것은?",choices:["세션 관리","권한 관리","로그 관리","취약점 관리"],answer:1,exp:"세션(Session): 사용자-시스템 또는 시스템 간 활성화된 접속. 이를 생성·유지·종료하는 것이 세션 관리."},
{id:"lg26n-07",subject:"정보보호론",unit:"보안관리",round:"2026 국가직 9급",q:"다음 설명에 해당하는 정보보호 위험 분석 방법은?\n\n정성적 위험 분석 방법으로, 시스템에 관한 전문적인 지식을 가진 전문가의 집단을 구성하고 위험을 분석 및 평가하여 정보시스템이 직면한 다양한 위협과 취약성을 토론을 통해 분석하는 방법이다.",choices:["확률 분포법","델파이법","과거 자료 분석법","수학 공식 접근법"],answer:2,exp:"정성적: 델파이법, 시나리오법, 순위결정법. 정량적: 과거자료 분석법, 수학공식법, 확률분포법.\n전문가 집단 토론 = 델파이법."},
{id:"lg26n-08",subject:"정보보호론",unit:"웹 보안",round:"2026 국가직 9급",q:"CAPTCHA에 대한 설명으로 옳지 않은 것은?",choices:["컴퓨터와 사람을 구분하기 위한 자동화된 공개 튜링 테스트라 할 수 있다.","기밀성을 보장하기 위한 암호의 한 형태이다.","다양한 이미지, 왜곡된 문자, 잡음 섞인 소리를 사용할 수 있다.","대부분의 사람들이 통과하기에는 쉽지만 컴퓨터가 통과하기에는 불가능하거나 어려워야 한다."],answer:2,exp:"CAPTCHA는 사람/봇 구별 테스트이며 암호(기밀성)와 무관. 자동 가입·무차별 대입 방지 등에 사용."},
{id:"lg26n-09",subject:"정보보호론",unit:"네트워크 보안",round:"2026 국가직 9급",q:"다음 설명에 해당하는 보안 솔루션은?\n\nIP 관리 시스템에서 발전한 것으로, MAC 주소를 기반으로 접근 제어 및 인증을 수행하여, 보안 정책에 부합되는 단말기에만 네트워크 자원의 이용을 허용한다.",choices:["NAC","DLP","VPN","PIMS"],answer:1,exp:"NAC(Network Access Control): 단말 인증·보안 정책 준수 여부 검사 후 네트워크 접속 허용.\nDLP=정보 유출 방지, VPN=가상 사설망, PIMS=개인정보 관리체계."},
{id:"lg26n-10",subject:"정보보호론",unit:"네트워크 보안",round:"2026 국가직 9급",q:"SSH 프로토콜(RFC 4251)의 구성요소에 해당하지 않는 것은?",choices:["핸드셰이크(Handshake) 프로토콜","사용자 인증(User Authentication) 프로토콜","전송 계층(Transport Layer) 프로토콜","연결(Connection) 프로토콜"],answer:1,exp:"SSH 3요소: 전송 계층 / 사용자 인증 / 연결 프로토콜.\n핸드셰이크 프로토콜은 SSL/TLS의 구성요소."},
{id:"lg26n-11",subject:"정보보호론",unit:"디지털 포렌식",round:"2026 국가직 9급",q:"(대검찰청) 디지털 증거의 수집ㆍ분석 및 관리 규정상 전자정보 압수ㆍ수색ㆍ검증의 기본원칙이 아닌 것은?",choices:["적법절차의 준수","디지털 증거의 신뢰성 유지","디지털 증거의 기밀성 유지","디지털 증거의 원본성 유지"],answer:3,exp:"포렌식 기본원칙: 적법절차, 원본성·무결성, 신뢰성 유지 등. '기밀성 유지'는 해당하지 않음."},
{id:"lg26n-12",subject:"정보보호론",unit:"보안관리",round:"2026 국가직 9급",q:"국내 정보보호 관리체계(ISMS)에서 ‘관리체계 수립 및 운영’의 PDCA 사이클을 바르게 나열한 것은?\n\n(가) 위험관리\n(나) 관리체계 운영\n(다) 관리체계 기반 마련\n(라) 관리체계 점검 및 개선\n\n순서: P → D → C·A",choices:["(가) → (나) → (라) → (다)","(가) → (다) → (나) → (라)","(다) → (가) → (나) → (라)","(다) → (나) → (가) → (라)"],answer:3,exp:"ISMS 관리체계 수립 및 운영 5단계: 관리체계 기반 마련 → 위험관리 → 관리체계 운영 → 점검 및 개선.\n(Plan: 기반 마련·위험관리 / Do: 운영 / Check·Act: 점검·개선)"},
{id:"lg26n-13",subject:"정보보호론",unit:"네트워크 보안",round:"2026 국가직 9급",q:"다음 설명에 해당하는 DoS/DDoS 공격기법은?\n\n순서 번호에 오류가 있게 조작된 IP 패킷 조각(fragments)을 전송하여, 이 패킷 조각을 전달받은 시스템의 IP 패킷 재조합 과정에서 오류가 발생되도록 하는 공격기법",choices:["Smurf","Teardrop","ICMP Flooding","Buffer Overflow"],answer:2,exp:"Teardrop: IP 단편화 오프셋(순서) 조작 → 재조합 오류. (Land·Ping of Death과 구분)"},

{id:"lg26n-15",subject:"정보보호론",unit:"암호학",round:"2026 국가직 9급",q:"RSA 암호 알고리즘은 키를 생성하는 과정에서 법(modulus) 연산의 곱셈에 대한 역원(multiplicative inverse)을 찾아야 한다. 법 26에 관한 완전잉여계 집합 Z26 ＝ {0, 1, …, 25}에 속한 원소 중에서 곱셈에 대한 역원이 존재하지 않는 것은?",choices:["7","11","13","23"],answer:3,exp:"a의 곱셈 역원은 gcd(a, 26)=1 일 때만 존재. 26=2×13이므로 13은 gcd=13 → 역원 없음.\n(7,11,23은 26과 서로소)"},
{id:"lg26n-16",subject:"정보보호론",unit:"보안관리",round:"2026 국가직 9급",q:"ISMS-P의 ‘보호대책 요구사항’ 분야에 해당하지 않는 것은?",choices:["정보주체 권리보호","재해 복구","외부자 보안","정책, 조직, 자산 관리"],answer:1,exp:"ISMS-P 3개 분야: ①관리체계 수립 및 운영 ②보호대책 요구사항 ③개인정보 처리 단계별 요구사항.\n정보주체 권리보호는 ③의 항목."},
{id:"lg26n-17",subject:"정보보호론",unit:"네트워크 보안",round:"2026 국가직 9급",q:"(가), (나)에 들어갈 용어를 바르게 연결한 것은?\n\nIPSec(RFC 2401)에서 (가)는 기밀성(confidentiality), 데이터 발신 인증(data origin authentication), 비연결 무결성(connectionless integrity) 등을 제공하는 프로토콜이다. 이 프로토콜은 기밀성을 제공하기 위해 (나) 암호 알고리즘을 사용하여 데이터를 암호화한다.",choices:["(가) AH  (나) 공개키","(가) AH  (나) 대칭키","(가) ESP  (나) 공개키","(가) ESP  (나) 대칭키"],answer:4,exp:"ESP: 기밀성 + 인증 + 무결성 제공 (데이터 암호화는 속도가 빠른 대칭키 사용).\nAH: 인증·무결성만 제공, 기밀성 없음."},
{id:"lg26n-18",subject:"정보보호론",unit:"개인정보 보호법",round:"2026 국가직 9급",q:"개인정보 보호법 상 개인정보 보호위원회의 위원 자격 요건에 해당하지 않는 사람은?",choices:["공공기관 또는 단체로부터 추천받은 사람으로서 개인정보 보호 업무를 3년 이상 담당하였던 사람","개인정보 보호 업무를 담당하는 3급 이상 공무원의 직에 있었던 사람","판사ㆍ검사ㆍ변호사의 직에 10년 이상 있었던 사람","대학 부교수 이상으로 3년 이상 재직하였던 사람"],answer:4,exp:"위원 자격(법 제7조의2): 개인정보 보호 업무 3급 이상 공무원 / 판·검사·변호사 10년 이상 / 단체 추천 + 보호 업무 3년 이상 / 대학 부교수 이상 5년 이상 재직.\n④는 '3년'이 아니라 '5년'."},
{id:"lg26n-19",subject:"정보보호론",unit:"개인정보 보호법",round:"2026 국가직 9급",q:"개인정보 보호법 상 정보주체의 개인정보 열람 요구 시에, 개인정보처리자가 정보주체에게 그 사유를 알리고 열람을 제한하거나 거절할 수 있는 경우가 아닌 것은?",choices:["법률에 따라 열람이 금지되거나 제한되는 경우","다른 사람의 재산과 그 밖의 이익을 부당하게 침해할 우려가 있는 경우","공공기관이 조세의 부과ㆍ징수 또는 환급에 관한 업무를 수행할 때 중대한 지장을 초래하는 경우","개인정보처리자의 정당한 이익을 달성하기 위하여 필요한 경우로서 명백하게 정보주체의 권리보다 우선하는 경우"],answer:4,exp:"④는 개인정보 수집·이용 허용 근거(법 제15조)의 하나로 열람 거절 사유가 아님.\n열람 제한 사유(법 제35조): 법률상 금지·제한, 타인의 생명·신체·재산 침해 우려, 공공기관의 중대한 업무 지장(조세, 학업성적·채용 평가, 감사 등)."},
{id:"lg26n-20",subject:"정보보호론",unit:"보안관리",round:"2026 국가직 9급",q:"보안관제 전문기업 지정 등에 관한 공고 상 보안관제 전문기업 지정기준으로 옳지 않은 것은?",choices:["법인 설립 이후 5년 이상일 것","자기 자본이 20억원 이상일 것","보안관제 수행능력 평가기준에 따라 실시한 심사에서 70점 이상을 받을 것","자격기준을 갖춘 기술인력을 15명 이상 보유할 것(고급기술자 3명 이상, 중급기술자 6명 이상을 포함하여야 한다)"],answer:1,exp:"지정기준: 법인 설립 이후 3년 이상 / 자기자본 20억원 이상 / 수행능력 평가 70점 이상 / 기술인력 15명 이상(고급 3, 중급 6 이상).\n(②③④는 보도 자료로 확인, ①의 '3년'은 기억 기준 — 최신 공고 확인 권장)"}
];

/* ========= 유틸/저장소 ========= */
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const NUM=["①","②","③","④","⑤","⑥"];

let extra=ld('cbt_extra',[]),wrong=ld('cbt_wrong',{}),bm=ld('cbt_bm',{}),notes=ld('cbt_notes',{});
let sess=ld('cbt_sess',null),theme=ld('cbt_theme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
let ALL=[],QM={};
function build(){const m=new Map();[...BASE,...extra].forEach(q=>{q.unit=q.unit||'기타';m.set(q.id,q)});ALL=[...m.values()];QM=Object.fromEntries(ALL.map(q=>[q.id,q]))}
build();
let view='home',selSub=null,selUnit=null,src='all',cnt=20,rnd=true,editing=false,navOpen=false;
const SUBJ=['컴퓨터일반','정보보호론'];
const subjects=()=>[...new Set([...SUBJ,...ALL.map(q=>q.subject)])];
const units=()=>[...new Set(ALL.filter(q=>selSub.has(q.subject)).map(q=>q.unit))];
const setTheme=()=>document.documentElement.setAttribute('data-theme',theme);
setTheme();
const toggleTheme=()=>{theme=theme=='dark'?'light':'dark';sv('cbt_theme',theme);setTheme();render()};
const saveSess=()=>sv('cbt_sess',sess);

/* ========= 홈 ========= */
function pool(){return ALL.filter(q=>selSub.has(q.subject)&&(!selUnit||selUnit.has(q.unit))&&(src=='all'||(src=='wrong'&&wrong[q.id])||(src=='bm'&&bm[q.id])))}
function home(){
  if(!selSub)selSub=new Set(subjects());
  const subs=subjects(),p=pool().length;
  if(cnt>p)cnt=Math.max(p,1);
  const can=sess&&!sess.done&&sess.ids.some(i=>QM[i]);
  $('#app').innerHTML=`
  <div class="bar"><h1>전산</h1><button class="ib" onclick="toggleTheme()">${theme=='dark'?'☀️':'🌙'}</button></div>
  ${can?`<button class="btn" style="margin:0 0 12px" onclick="resume()">▶ 이어서 풀기 (${sess.i+1} / ${sess.ids.length})</button>`:''}
  <div class="card"><h3>과목</h3><div class="chips">
    <button class="chip ${selSub.size==subs.length?'on':''}" onclick="allSub()">전체</button>
    ${subs.map((s,i)=>`<button class="chip ${selSub.has(s)?'on':''}" onclick="togSub(${i})">${esc(s)} (${ALL.filter(q=>q.subject==s).length})</button>`).join('')}
  </div></div>
  <div class="card"><h3>단원</h3><div class="chips">
    <button class="chip ${!selUnit?'on':''}" onclick="allUnit()">전체</button>
    ${units().map((u,i)=>`<button class="chip ${selUnit&&selUnit.has(u)?'on':''}" onclick="togUnit(${i})">${esc(u)} (${ALL.filter(q=>selSub.has(q.subject)&&q.unit==u).length})</button>`).join('')}
  </div></div>
  <div class="card"><h3>문제 범위</h3><div class="chips">
    ${[['all','전체'],['wrong',`틀린 문제 (${Object.keys(wrong).filter(i=>QM[i]).length})`],['bm',`북마크 (${Object.keys(bm).filter(i=>QM[i]).length})`]].map(([k,l])=>`<button class="chip ${src==k?'on':''}" onclick="setSrc('${k}')">${l}</button>`).join('')}
  </div></div>
  <div class="card"><h3>문제 수 / 순서</h3><div class="row">
    <input type="number" id="cnt" min="1" max="${p}" value="${cnt}" onchange="cnt=+this.value"> 문제 <span class="sm">(최대 ${p})</span>
    <label><input type="checkbox" id="rnd" ${rnd?'checked':''} onchange="rnd=this.checked"> 랜덤</label>
  </div></div>
  <button class="btn" onclick="startNew()" ${p?'':'disabled'}>풀이 시작</button>
  <div class="card" style="margin-top:16px"><h3>데이터 관리</h3>
    <div class="row"><button class="ib" onclick="$('#file').click()">문제 불러오기(JSON)</button>
    <button class="ib" onclick="exportData()">백업 내보내기</button>
    <button class="ib" onclick="resetAll()">기록 초기화</button></div>
    <input type="file" id="file" accept=".json" hidden onchange="impFile(event)">
    <p class="sm">풀이 수정·북마크·오답 기록은 이 브라우저에 저장됩니다. 다른 기기에서 쓰려면 백업을 내보내고 불러오세요.</p>
  </div>`;
}
function togSub(i){const s=subjects()[i];selSub.has(s)?selSub.delete(s):selSub.add(s);if(!selSub.size)selSub.add(s);selUnit=null;render()}
function togUnit(i){const u=units()[i];if(!selUnit)selUnit=new Set();selUnit.has(u)?selUnit.delete(u):selUnit.add(u);if(!selUnit.size)selUnit=null;render()}
function allUnit(){selUnit=null;render()}
function allSub(){selSub=new Set(subjects());selUnit=null;render()}
function setSrc(k){src=k;render()}
function startNew(){
  cnt=Math.max(1,+$('#cnt').value||1);
  let l=pool();if(rnd)l=shuffle(l);
  start(l.slice(0,cnt).map(q=>q.id));
}
function start(ids){sess={ids,ans:{},i:0,done:false};saveSess();view='quiz';editing=false;navOpen=false;render();scrollTo(0,0)}
function resume(){sess.ids=sess.ids.filter(i=>QM[i]);view='quiz';render()}

/* ========= 풀이 ========= */
function quiz(){
  const id=sess.ids[sess.i],q=QM[id],n=sess.ids.length,a=sess.ans[id],done=a!=null;
  const exp=notes[id]!=null?notes[id]:(q.exp||'');
  $('#app').innerHTML=`
  <div class="bar"><button class="ib" onclick="goHome()">홈</button>
    <div class="mid">${sess.i+1} / ${n}</div>
    <button class="ib" onclick="navOpen=true;render()">번호</button>
    <button class="ib" onclick="toggleTheme()">${theme=='dark'?'☀️':'🌙'}</button></div>
  <div class="prog"><i style="width:${(Object.keys(sess.ans).length/n)*100}%"></i></div>
  <div class="card">
    <div class="tag"><span><b>${esc(q.subject)}</b> · ${esc(q.unit)} · ${esc(q.round||'')}</span>
      <button class="star ${bm[id]?'on':''}" onclick="togBm()" title="북마크">${bm[id]?'★':'☆'}</button></div>
    <div class="qn">Q${sess.i+1}.</div>
    <div class="qt">${esc(q.q)}</div>
    ${q.img?`<img class="qimg" src="${q.img}" alt="문제 그림">`:''}
    ${q.choices.map((c,i)=>`<button class="ch ${done?(i+1==q.answer?'ok':(i+1==a?'no':'')):''}" onclick="pick(${i+1})"><b>${NUM[i]}</b><span>${esc(c)}</span></button>`).join('')}
    ${done?`<div class="res ${a==q.answer?'ok':'no'}">${a==q.answer?'⭕ 정답입니다!':'❌ 오답 — 정답: '+NUM[q.answer-1]}</div>
    <div class="ex">${editing?`<textarea id="exta">${esc(exp)}</textarea><div class="row" style="margin-top:8px"><button class="ib" onclick="saveExp()">저장</button><button class="ib" onclick="editing=false;render()">취소</button></div>`
      :`<b>풀이</b> <button class="ib" style="padding:2px 8px;font-size:12px" onclick="editing=true;render()">✏️ 수정</button>\n${esc(exp)||'<span class="sm">풀이가 없습니다. 수정 버튼으로 암기팁을 추가하세요.</span>'}`}</div>`:''}
  </div>
  <div class="nav"><button class="btn g" onclick="go(-1)" ${sess.i==0?'disabled':''}>◀ 이전</button>
  <button class="btn" onclick="${sess.i==n-1?'finish()':'go(1)'}">${sess.i==n-1?'결과 보기':'다음 ▶'}</button></div>
  ${navOpen?navSheet():''}`;
}
function navSheet(){
  return `<div class="ov" onclick="if(event.target==this){navOpen=false;render()}"><div class="sheet">
  <div class="row" style="justify-content:space-between"><b>문제 번호</b><button class="ib" onclick="navOpen=false;render()">닫기</button></div>
  <div class="sm">초록=정답 · 빨강=오답 · ★=북마크</div>
  <div class="grid">${sess.ids.map((id,i)=>{const a=sess.ans[id];return `<button class="cell ${a!=null?(a==QM[id].answer?'ok':'no'):''} ${i==sess.i?'cur':''} ${bm[id]?'bm':''}" onclick="jump(${i})">${i+1}</button>`}).join('')}</div>
  <button class="btn g" onclick="finish()">결과 보기</button></div></div>`;
}
function pick(c){
  const id=sess.ids[sess.i];if(sess.ans[id]!=null)return;
  sess.ans[id]=c;
  if(c==QM[id].answer)delete wrong[id];else wrong[id]=1;
  sv('cbt_wrong',wrong);saveSess();render();
}
function go(d){sess.i=Math.min(Math.max(sess.i+d,0),sess.ids.length-1);editing=false;saveSess();render();scrollTo(0,0)}
function jump(i){sess.i=i;navOpen=false;editing=false;saveSess();render();scrollTo(0,0)}
function togBm(){const id=sess.ids[sess.i];bm[id]?delete bm[id]:bm[id]=1;sv('cbt_bm',bm);render()}
function saveExp(){
  const id=sess.ids[sess.i],v=$('#exta').value;
  if(v.trim()===(QM[id].exp||'').trim())delete notes[id];else notes[id]=v;
  sv('cbt_notes',notes);editing=false;render();
}
function goHome(){view='home';render()}
function finish(){sess.done=true;saveSess();view='result';navOpen=false;render();scrollTo(0,0)}

/* ========= 결과 ========= */
function result(){
  const n=sess.ids.length,ok=sess.ids.filter(i=>sess.ans[i]==QM[i].answer).length;
  const wr=sess.ids.filter(i=>sess.ans[i]!=null&&sess.ans[i]!=QM[i].answer),un=n-Object.keys(sess.ans).length;
  $('#app').innerHTML=`<div class="bar"><h1>결과</h1><button class="ib" onclick="toggleTheme()">${theme=='dark'?'☀️':'🌙'}</button></div>
  <div class="card"><div class="big">${ok} / ${n}</div>
  <div style="text-align:center">정답률 ${Math.round(ok/n*100)}% · 오답 ${wr.length} · 안 푼 문제 ${un}</div></div>
  ${wr.length?`<button class="btn w" onclick="start(shuffle(${JSON.stringify(wr).replace(/"/g,'&quot;')}))">🔁 틀린 문제 다시 풀기 (${wr.length})</button>`:''}
  <button class="btn g" onclick="view='quiz';sess.i=0;render()">문제 리뷰하기</button>
  <button class="btn g" onclick="start(shuffle(sess.ids))">전체 다시 풀기</button>
  <button class="btn g" onclick="goHome()">홈으로</button>`;
}

/* ========= 데이터 ========= */
function impFile(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);let msg='';
    const qs=Array.isArray(d)?d:d.questions;
    if(qs){const ok=qs.filter(q=>q.id&&q.subject&&q.q&&Array.isArray(q.choices)&&q.answer);
      const m=new Map(extra.map(q=>[q.id,q]));ok.forEach(q=>m.set(q.id,q));extra=[...m.values()];sv('cbt_extra',extra);msg+=`문제 ${ok.length}개 추가. `}
    if(!Array.isArray(d)){
      if(d.notes){Object.assign(notes,d.notes);sv('cbt_notes',notes)}
      if(d.bm){Object.assign(bm,d.bm);sv('cbt_bm',bm)}
      if(d.wrong){Object.assign(wrong,d.wrong);sv('cbt_wrong',wrong)}
      msg+='기록 복원 완료.'}
    build();selSub=null;selUnit=null;alert(msg||'불러온 내용이 없습니다.');render();
  }catch(err){alert('JSON 파일을 읽을 수 없습니다.')}};
  r.readAsText(f);
}
function exportData(){
  const b=new Blob([JSON.stringify({questions:extra,notes,bm,wrong},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cbt-backup.json';a.click();
}
function resetAll(){
  if(!confirm('오답·북마크·이어풀기 기록을 초기화할까요? (풀이 수정 내용은 유지됩니다)'))return;
  wrong={};bm={};sess=null;['cbt_wrong','cbt_bm','cbt_sess'].forEach(k=>localStorage.removeItem(k));render();
}

/* ========= 렌더/키보드 ========= */
function render(){
  if(view!='home'&&!sess)view='home';
  ({home,quiz,result})[view]();
}
document.addEventListener('keydown',e=>{
  if(view!='quiz'||editing||/TEXTAREA|INPUT/.test(e.target.tagName))return;
  if(/^[1-6]$/.test(e.key)&&+e.key<=QM[sess.ids[sess.i]].choices.length)pick(+e.key);
  else if(e.key=='ArrowRight'&&sess.i<sess.ids.length-1)go(1);
  else if(e.key=='ArrowLeft')go(-1);
});
render();
</script>
</body>
</html>
